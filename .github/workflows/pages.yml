name: Test and publish Study Tracker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:database
      - run: npm run test:postgres
      - run: npm run test:shared
      - run: npm run test:username
      - name: Prepare browser
        timeout-minutes: 8
        run: |
          study_browser_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$study_browser_path" ]; then
            "$study_browser_path" --version
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$study_browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:browser
      - run: npm run test:shared-auth
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
